name: Déploiement du portail sur o2switch (FTPS)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "deploy-o2switch"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Construction stricte, accessibilité, PDF et PDF/UA-1 : mêmes contrôles que les pull requests
      - name: Build and check the portal
        uses: ./.github/actions/build-portal

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Add Apache configuration
        run: cp deploy/o2switch/htaccess site/.htaccess

      # Compte FTP dédié, cantonné au répertoire du site ; TLS obligatoire et certificat vérifié.
      - name: Déploiement FTPS
        env:
          FTP_HOST: ${{ vars.O2_FTP_HOST }}
          FTP_USERNAME: ${{ secrets.O2_FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.O2_FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME" --env-password "ftp://$FTP_HOST" -e "
            set ftp:ssl-force yes;
            set ftp:ssl-protect-data yes;
            set ssl:verify-certificate yes;
            set ftp:passive-mode yes;
            set net:max-retries 2;
            mirror --reverse --delete --verbose --no-perms --exclude '^\\.ftpquota$' --exclude '^cgi-bin/' --exclude '^\\.well-known/' ./site/ ./;
            bye"
