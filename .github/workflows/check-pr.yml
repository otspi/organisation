name: Vérification des pull requests (build, accessibilité et PDF)

# Mêmes étapes de construction que le déploiement, sans déploiement ni secret :
# le site et les PDF du portail (livre blanc, statuts, règlement intérieur, charte) sont validés
# avant fusion, et les PDF joints en artefact pour relecture.

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: "check-pr-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-pdf.txt
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 poppler-utils

      - name: Build documentation
        run: mkdocs build --strict

      # Accessibilité des pages HTML (WCAG 2 AA, moteur axe) : Chrome du runner, sans téléchargement
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check accessibility (pa11y, axe)
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          CHROME: /usr/bin/google-chrome
        run: |
          npm install --no-save --no-audit --no-fund pa11y@9
          node scripts/check_a11y.js site

      - name: Export PDF
        run: python scripts/export_pdf.py

      - name: Cache veraPDF
        uses: actions/cache@v4
        with:
          path: ~/.cache/verapdf
          key: verapdf-1.30.2

      - name: Validate PDF/UA-1
        run: bash scripts/check_pdf_ua.sh

      # Polices embarquées : Inter pour le texte ; toute autre police signale un glyphe absent d'Inter
      - name: List embedded fonts
        run: |
          for pdf in $(find site -name 'otspi-*.pdf' | sort); do
            echo "== $pdf"
            pdffonts "$pdf"
          done

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: portail-pdf
          path: site/**/otspi-*.pdf
          retention-days: 14
