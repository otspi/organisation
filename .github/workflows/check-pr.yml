name: Vérification des pull requests (build, accessibilité et PDF)

# Mêmes étapes de construction que le déploiement (.github/actions/build-portal), sans déploiement ni secret :
# le site et les PDF du portail (livre blanc, statuts, règlement intérieur, charte) sont validés
# avant fusion, et les PDF joints en artefact pour relecture.

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: "check-pr-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build and check the portal
        uses: ./.github/actions/build-portal

      # Polices embarquées : Inter pour le texte ; toute autre police signale un glyphe absent d'Inter
      - name: List embedded fonts
        run: |
          for pdf in $(find site -name 'otspi-*.pdf' | sort); do
            echo "== $pdf"
            pdffonts "$pdf"
          done

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: portail-pdf
          path: site/**/otspi-*.pdf
          retention-days: 14
