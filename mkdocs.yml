site_name: OTSPI — Open Trusted Service Provider Initiative
site_url: https://about.otspi.org
site_description: Portail de gouvernance, statuts, conformité et documentation de l'association Open Trusted Service Provider Initiative (OTSPI).
site_author: Membres Fondateurs OTSPI

repo_name: otspi/organisation
repo_url: https://github.com/otspi/organisation
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 OTSPI — Contenu sous licence Creative Commons Attribution 4.0 International (CC-BY-4.0).

# Liens internes : un lien vers une ancre absente (titre renommé, par exemple) fait échouer
# le build strict, comme un lien vers une page absente.
validation:
  anchors: warn

hooks:
  - hooks/page_lang.py

theme:
  name: material
  custom_dir: overrides
  language: fr
  # Couleurs de la charte OTSPI (bleu nuit du logo) : voir docs/stylesheets/extra.css
  palette:
    # Mode clair
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Passer au mode sombre
    # Mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Passer au mode clair
  logo: assets/logo-header.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  # Pas de Google Fonts (l'adresse IP du visiteur y serait transmise) : la police Inter est
  # auto-hébergée (stylesheets/fonts.css)
  font: false
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.expand
    - navigation.indexes
    - navigation.path
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.action.view

extra_javascript:
  - javascripts/a11y.js?v=2
  - javascripts/analytics.js?v=2

extra_css:
  - stylesheets/fonts.css
  - stylesheets/extra.css
  - stylesheets/print.css

plugins:
  # Recherche en français et en anglais (livre blanc et page des hébergements existent dans les deux langues)
  - search:
      lang:
        - fr
        - en

markdown_extensions:
  - admonition
  - md_in_html
  - attr_list
  - tables
  - footnotes
  - def_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.mark
  - toc:
      permalink: true

extra:
  # Pas de mention « Made with Material for MkDocs » en pied de page
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/otspi/organisation
      name: Dépôt GitHub
    - icon: fontawesome/solid/globe
      link: https://www.otspi.org
      name: Site www.otspi.org
    - icon: fontawesome/solid/envelope
      link: mailto:contact@otspi.org
      name: Contact par e-mail

nav:
  - Accueil: index.md
  - Livre blanc:
      - Livre blanc (FR): livre-blanc/index.md
      - White Paper (EN): white-paper/index.md
      - Historique des versions: livre-blanc/historique.md
  - Statuts et gouvernance:
      - Projet de statuts: statuts/statuts-association.md
      - Historique du projet de statuts: statuts/historique.md
      - Charte d'éthique: gouvernance/charte-ethique.md
      - Organisation technique et CPC: gouvernance/comite-technique.md
  - Règlement intérieur:
      - Règlement intérieur: reglement-interieur/reglement-interieur.md
  - Démarches administratives:
      - Procès-verbal constitutif (modèle): administratif/pv-ag-constitutive-modele.md
      - Demande de rescrit fiscal DGFIP: administratif/rescrit-fiscal-mecenat.md
      - Dossier de constitution: administratif/dossier-constitution.md
      - Résolution d'amorçage (CPC et Bureau): administratif/resolution-transitoire.md
      - Démarches en préfecture (RNA, SIRET): administratif/declaration-prefecture.md
  - Socle technique et audit (TSP / PKI):
      - Vue d'ensemble: cadrage/index.md
      - Cadre CP/CPS (RFC 3647): cadrage/cp-cps-cadre.md
      - Politique de sécurité des SI (PSSI): cadrage/pssi.md
      - Plan de fin d'activité (Termination Plan): cadrage/termination-plan.md
      - Arc d'OID et numéro IANA: cadrage/oid-arc.md
      - Demandes de devis (audit, HSM, hébergement): cadrage/demandes-de-devis.md
  - Transparence:
      - Hébergements: reunions/hebergements.md
      - Hosting transparency (EN): reunions/hosting.md
      - Registre des réunions et PV: reunions/index.md
  - Participer:
      - participer/index.md
      - Site de l'association: https://www.otspi.org/
